<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMART PHARMACY</title><link rel="stylesheet" href="css/style.css"></head><body><header>💊 SMART PHARMACY</header><main><section id="auth" class="card"><h2>দোকান নিবন্ধন / লগইন</h2><div class="tabs"><button id="regTab">নতুন দোকান</button><button id="loginTab">লগইন</button></div><form id="regForm"><label>দোকানের নাম<input id="shop" required></label><label>মালিকের নাম<input id="owner" required></label><label>মোবাইল<input id="phone" required></label><label>ইমেইল<input id="email" type="email" required></label><label>পাসওয়ার্ড<input id="pass" type="password" minlength="8" required></label><button>দোকান নিবন্ধন</button></form><form id="logForm" class="hide"><label>ইমেইল<input id="loginEmail" type="email" required></label><label>পাসওয়ার্ড<input id="loginPass" type="password" required></label><button>লগইন</button><button type="button" id="forgot" class="link">পাসওয়ার্ড ভুলে গেছেন?</button></form><p id="msg"></p></section><section id="dash" class="card hide"><h2 id="welcome">ড্যাশবোর্ড</h2><p id="details"></p><div class="grid"><div>💊 ওষুধের স্টক</div><div>🧾 বিক্রি ও বিল</div><div>📦 ক্রয়</div><div>👥 কর্মচারী</div><div>📊 রিপোর্ট</div><div>🛟 সহায়তা</div></div><p>এটি প্রাথমিক সংস্করণ; পূর্ণ ফিচার ও নিরাপত্তা সেটআপ পরবর্তী ধাপে হবে।</p><button id="logout">লগআউট</button></section></main><script type="module" src="js/app.js"></script></body></html>
